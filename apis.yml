aid: scg-cell-therapy
name: SCG Cell Therapy
description: >-
  SCG Cell Therapy Pte. Ltd. is a clinical-stage biotechnology company headquartered in
  Singapore, with operations across Singapore, China and Germany, developing novel
  immunotherapies for infectious diseases and the cancers they cause. The company targets
  the most common cancer-causing infections — Helicobacter pylori, human papillomavirus
  (HPV), hepatitis B virus (HBV) and Epstein-Barr virus (EBV) — and is advancing a pipeline
  of TCR-engineered T cell therapies, antibodies and therapeutic vaccines built on its
  proprietary GianTCR platform. Lead programs include SCG101, a first-in-class autologous
  HBV-specific TCR-T therapy targeting hepatitis B surface antigen in HBV-related
  hepatocellular carcinoma, and SCG142, a next-generation HPV E7-specific TCR-T therapy for
  HPV-associated solid tumors that received FDA IND clearance. SCG covers the full value
  chain from drug discovery and manufacturing through clinical development and
  commercialization. It is a therapeutics developer, not a software vendor, and publishes
  no public API, developer portal or machine-readable contract.
